name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *' # Executa todo dia às 03:00 (Horário de Brasília / UTC-3 = 06:00 UTC)
  workflow_dispatch: # Permite execução manual para testes na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          # Fallback para os dados do projeto se não houver Secrets configurados
          if [ -z "$URL" ]; then
            URL="https://vtskautbkbhqwinuassp.supabase.co"
          fi
          if [ -z "$KEY" ]; then
            KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0c2thdXRia2JocXdpbnVhc3NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4OTEwMjcsImV4cCI6MjA3NjQ2NzAyN30.EqQChO6dPqP0YHWVkyzPT2cXcIzkvm1WqLblU9bfNmM"
          fi

          echo "Pingando banco Supabase em: $URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$URL/rest/v1/healthcheck?select=*" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "$RESPONSE"